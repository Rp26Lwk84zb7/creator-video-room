[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creator-video-room"
version = "0.1.0"
description = "A small FastAPI service for creator video rooms and scoped participant tokens."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/creator_room"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
